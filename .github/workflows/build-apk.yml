name: Build Iron APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Iron version (X.Y.Z)"
        required: true
        default: "2.2.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Checkout Iron web app
        uses: actions/checkout@v4
        with:
          repository: Mune-Su/Iron
          path: iron-src

      - name: Copy Iron web files into www
        run: |
          mkdir -p www
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.vercel' \
            --exclude='node_modules' --exclude='*.ps1' --exclude='*.md' \
            iron-src/ www/
          ls -la www

      - name: Add the in-app update prompt to the web files
        run: |
          cp native/native-updater.js www/native-updater.js
          sed -i 's#</body>#<script src="native-updater.js"></script>\n</body>#I' www/index.html
          grep -q 'native-updater.js' www/index.html || { echo "Could not add the updater: no </body> in www/index.html"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add native updater, permissions and version
        run: |
          JAVA_DIR=android/app/src/main/java/com/munesu/iron
          cp native/IronUpdaterPlugin.java "$JAVA_DIR/IronUpdaterPlugin.java"
          cp native/MainActivity.java "$JAVA_DIR/MainActivity.java"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>#' "$MANIFEST"
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${{ inputs.version }}\"/" android/app/build.gradle
          grep -n "RECORD_AUDIO\|REQUEST_INSTALL_PACKAGES\|fileprovider" "$MANIFEST"
          grep -n "versionCode\|versionName" android/app/build.gradle
          cat android/app/src/main/res/xml/file_paths.xml

      - name: Use Iron's app icon
        run: |
          RES=android/app/src/main/res
          rm -f $RES/mipmap-*/ic_launcher*.webp
          cp -r native/res/* $RES/
          ls $RES/mipmap-xxxhdpi $RES/mipmap-anydpi-v26

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Keep the same signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: iron-debug-keystore-v1

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Iron-${{ inputs.version }}.apk"

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}-b${{ github.run_number }}
          name: Iron ${{ inputs.version }}
          files: Iron-${{ inputs.version }}.apk
