name: Build Iron APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Iron version (X.Y.Z)"
        required: true
        default: "2.2.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Checkout Iron web app
        uses: actions/checkout@v4
        with:
          repository: Mune-Su/Iron
          path: iron-src

      - name: Copy Iron web files into www
        run: |
          mkdir -p www
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.vercel' \
            --exclude='node_modules' --exclude='*.ps1' --exclude='*.md' \
            iron-src/ www/
          ls -la www

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add mic permission and set version
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' "$MANIFEST"
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${{ inputs.version }}\"/" android/app/build.gradle
          grep -n "RECORD_AUDIO" "$MANIFEST"
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Keep the same signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: iron-debug-keystore-v1

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Iron-${{ inputs.version }}.apk"

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}-b${{ github.run_number }}
          name: Iron ${{ inputs.version }}
          files: Iron-${{ inputs.version }}.apk
